<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="">
    <meta name="author" content="Orion Blackstock">

    <link href="https://stackpath.bootstrapcdn.com/bootswatch/4.1.2/cerulean/bootstrap.min.css" rel="stylesheet" integrity="sha384-EmRcsPP774S9MOi4ywB+JXUWjYnBdyInMzG2XsC5siZEUpexqxOMJW358dCYEjPu" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" th:href="@{/css/master.css}">
    <title>eRegistrar - a demo spring boot webapp</title>
    <style>
        :root {
            --eregistrar-purple: #6f2fa8;
            --eregistrar-purple-dark: #4b1d73;
        }
        .navbar.bg-primary { background-color: var(--eregistrar-purple) !important; }
        .btn-primary { background-color: var(--eregistrar-purple); border-color: var(--eregistrar-purple); }
        a, .nav-link { color: var(--eregistrar-purple); }
        .navbar-dark .nav-link, .navbar-dark .navbar-brand { color: #ffffff; }
        .navbar-dark .nav-link:hover { color: #e6d9f5; }
        h3 { color: var(--eregistrar-purple-dark); }
        hr { border-top: 2px solid var(--eregistrar-purple); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a style="padding-right: 2em;" class="navbar-brand" href="/eregistrar/home">Orion's eRegistrar : : : a basic demo webapp using Spring Boot</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarColor01">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item" style="border-left: white 1px solid; padding-left: 2em; padding-right: 2em;">
                <a class="nav-link" href="/eregistrar/course/list">Browse Courses</a>
            </li>
            <li class="nav-item" style="padding-left: 1em; padding-right: 1em;">
                <a class="nav-link" href="/eregistrar/registration/list">My Registrations</a>
            </li>
        </ul>
        <form class="form-inline my-2 my-lg-0">
            <!--<input class="form-control mr-sm-2" type="text" placeholder="Search">-->
            <!--<a href="#" class="btn btn-secondary">Sign In</a>-->
        </form>
    </div>
</nav>

<p>&nbsp;</p>
<div class="container">
    <h3>Student Registration</h3>
    <hr/>

    <div class="alert alert-success" th:if="${submitted}">
        Thanks, <span th:text="${fullName}"></span>! Registration received for student ID
        <span th:text="${studentId}"></span> - <span th:text="${courseCount}"></span> course(s) submitted.
    </div>

    <p>
        Fill out the form below to register for the upcoming term. Fields marked with <span style="color:#c0392b;">*</span> are required.
    </p>

    <form th:action="@{/eregistrar/register}" method="post">

        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="fullName">Full Name *</label>
                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Jane Student" required>
            </div>
            <div class="form-group col-md-6">
                <label for="studentId">Student ID *</label>
                <input type="text" class="form-control" id="studentId" name="studentId" placeholder="e.g. 20261234" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="email">Email *</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="jane.student@miu.edu" required>
            </div>
            <div class="form-group col-md-6">
                <label for="phone">Phone</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="(555) 555-5555">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="major">Program / Major *</label>
                <select class="form-control" id="major" name="major" required>
                    <option value="" selected disabled>Choose...</option>
                    <option value="cs">Computer Science</option>
                    <option value="se">Software Engineering</option>
                    <option value="it">Performing Arts</option>
                    <option value="business">Finance</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group col-md-6">
                <label for="term">Term *</label>
                <select class="form-control" id="term" name="term" required>
                    <option value="" selected disabled>Choose...</option>
                    <option value="fall2026">Fall 2026</option>
                    <option value="spring2027">Spring 2027</option>
                    <option value="summer2027">Summer 2027</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Courses *</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="courses" value="CS101" id="course1">
                <label class="form-check-label" for="course1">CS525 - Advance Software Development</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="courses" value="CS210" id="course2">
                <label class="form-check-label" for="course2">CS516 - Cloud Computing</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="courses" value="SE310" id="course3">
                <label class="form-check-label" for="course3">CS425 - Software Engineering</label>
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes for the Registrar</label>
            <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Accommodations, advisor overrides, or anything else we should know"></textarea>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="confirm" name="confirm" required>
            <label class="form-check-label" for="confirm">
                I confirm the information above is accurate and I understand courses are subject to seat availability.
            </label>
        </div>

        <button type="submit" class="btn btn-primary">Submit Registration</button>
        <button type="reset" class="btn btn-outline-secondary">Clear Form</button>
    </form>
</div>

</html>
