spring.application.name=eregistrar

# --- MySQL datasource ---
# Create the schema first, e.g.:  CREATE DATABASE eregistrar_db;
# Then update username/password below to match your local MySQL install.
spring.datasource.url=jdbc:mysql://localhost:3306/eregistrar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=PutyourpasswordDatabaseshouldcreateifnotexist
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" so the schema evolves with the entities without wiping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
